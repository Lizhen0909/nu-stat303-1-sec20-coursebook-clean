<text x="36" y="541" font-size="24" fill="#4e2a84" font-weight="700">Position 0 → label 104 → Cedar</text>
<text x="36" y="573" font-size="19" fill="#525c6d" font-weight="normal">Positions describe row order. The index stores labels. Title, Rating, and Tickets are data columns.</text>
