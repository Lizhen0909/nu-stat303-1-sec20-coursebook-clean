<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Python loops and NumPy vectorization</title>
<desc id="desc">Both approaches double the values 1, 2, 3, and 4 to produce 2, 4, 6, and 8. A Python loop executes the loop body for every element. NumPy dispatches an array operation to compiled code, reducing Python interpreter overhead.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="1200" height="610" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172b4d">
<text x="40" y="47" font-size="26" font-weight="700">Same calculation. Less work in the Python interpreter.</text>
<text x="40" y="79" font-size="18" fill="#475569">Example: double every value in a numeric NumPy array a = [1, 2, 3, 4]</text>
<rect x="30" y="104" width="555" height="390" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="615" y="104" width="555" height="390" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="54" y="141" font-size="23" font-weight="700">Python loop</text>
<text x="639" y="141" font-size="23" font-weight="700">NumPy vectorization</text>
<g font-family="monospace" font-size="19">
<text x="54" y="181">result = []</text><text x="54" y="209">for value in a:</text><text x="54" y="237">    result.append(value * 2)</text>
<text x="639" y="181">result = a * 2</text>
</g>
<text x="54" y="283" font-size="17" fill="#475569">Execute the Python loop body for each element</text>
<g fill="#fff7ed" stroke="#c27832"><rect x="54" y="307" width="105" height="58" rx="8"/><rect x="188" y="307" width="105" height="58" rx="8"/><rect x="322" y="307" width="105" height="58" rx="8"/><rect x="456" y="307" width="105" height="58" rx="8"/></g>
<g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M160 336 H183"/><path d="M294 336 H317"/><path d="M428 336 H451"/><path d="M892 206 V243"/></g>
<g font-size="19" text-anchor="middle"><text x="106" y="342">1 × 2</text><text x="240" y="342">2 × 2</text><text x="374" y="342">3 × 2</text><text x="508" y="342">4 × 2</text></g>
<rect x="639" y="255" width="507" height="110" rx="8" fill="#eaf6f3" stroke="#258477"/>
<text x="892" y="288" text-anchor="middle" font-size="19" font-weight="700">Compiled NumPy operation</text>
<text x="892" y="320" text-anchor="middle" font-size="20" font-family="monospace">[1, 2, 3, 4] × 2</text>
<text x="892" y="347" text-anchor="middle" font-size="16">Iteration happens internally</text>
<g font-size="20" font-family="monospace"><text x="54" y="407">Result: [2, 4, 6, 8]</text><text x="639" y="407">Result: [2, 4, 6, 8]</text></g>
<text x="54" y="449" font-size="17">Repeated Python-level execution</text><text x="639" y="449" font-size="17">Less Python overhead; concise array code</text>
<text x="40" y="534" font-size="19" font-weight="700">Why it helps: large numeric arrays usually benefit most.</text>
<text x="40" y="568" font-size="17" fill="#475569">Vectorization still performs the calculations; it moves iteration into compiled code.</text>
<text x="40" y="592" font-size="17" fill="#475569">Actual speed depends on array size, data type, memory use, and the operation.</text>
</g></svg>