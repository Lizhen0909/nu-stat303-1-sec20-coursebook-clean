<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
<title id="title">Row position and index label are different</title>
<desc id="desc">The screenings DataFrame has five rows. Positions 0, 1, 2, 3, and 4 correspond to index labels 104, 101, 107, 103, and 109. The first row is Cedar, with rating 7.2 and 120 tickets. Position numbers appear outside the DataFrame as annotations, not as a stored column.</desc>
<rect width="1100" height="590" rx="20" fill="#f7f8fc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#202639">
<text x="36" y="50" font-size="31" fill="#202639" font-weight="700">Row position ≠ index label</text>
<text x="36" y="85" font-size="22" fill="#525c6d" font-weight="normal">The first row is at position 0, even though its index label is 104.</text>
<text x="46" y="144" font-size="21" fill="#8c4b1c" font-weight="700">Position</text>
<text x="46" y="170" font-size="16" fill="#525c6d" font-weight="normal">annotation only</text>
<text x="238" y="144" font-size="21" fill="#4e2a84" font-weight="700">Index label</text>
<text x="444" y="144" font-size="21" fill="#15665e" font-weight="700">Data columns</text>
<rect x="220" y="182" width="842" height="314" rx="10" fill="white" stroke="#d8dce5"/>
<rect x="220" y="238" width="842" height="50" fill="#ede9f5"/>
