<text x="742" y="219" font-size="22" fill="#15665e" font-weight="700">Rating</text>
<text x="906" y="219" font-size="22" fill="#15665e" font-weight="700">Tickets</text>
<text x="84" y="270" font-size="23" fill="#8c4b1c" font-weight="700">0</text>
